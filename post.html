<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Post Airdrop - Airdrop Mining Zone</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #101720;
      border-bottom: 1px solid #202a35;
    }

    header h1 {
      margin: 0;
      color: #00ff99;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: 25px auto;
    }

    .box {
      background: #111820;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #26323e;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;

      background: #0b1015;
      color: white;

      border: 1px solid #293541;
      border-radius: 8px;
      outline: none;

      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;

      background: #00d084;
      color: #001b10;

      border: 0;
      border-radius: 8px;

      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .logout {
      background: #252e38;
      color: white;
      margin-top: 10px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #00ff99;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>📝 Post New Airdrop</h1>
  </header>


  <main class="container">

    <div class="box">

      <form id="postForm">

        <input
          type="text"
          id="name"
          placeholder="Airdrop Name"
          required
        >

        <textarea
          id="description"
          placeholder="Airdrop Description"
          required
        ></textarea>

        <input
          type="text"
          id="mining_time"
          placeholder="Mining Time"
          required
        >

        <input
          type="text"
          id="reward"
          placeholder="Reward"
          required
        >

        <input
          type="text"
          id="min_withdraw"
          placeholder="Minimum Withdraw"
          required
        >

        <input
          type="url"
          id="join_link"
          placeholder="Join Link (https://...)"
          required
        >

        <button type="submit">
          🚀 POST AIRDROP
        </button>

      </form>


      <button
        class="logout"
        id="logoutBtn"
        type="button"
      >
        LOGOUT
      </button>


      <div id="message"></div>


      <a
        class="back"
        href="index.html"
      >
        ← Back to Home
      </a>

    </div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://zuqcvankzuofzzpdrycq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("postForm");

    const message =
      document.getElementById("message");

    const logoutBtn =
      document.getElementById("logoutBtn");


    // Check login
    async function checkAdmin() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        window.location.href = "login.html";

        return null;
      }


      return user;
    }


    checkAdmin();


    // Post Airdrop
    form.addEventListener("submit", async function(e) {

      e.preventDefault();


      const user =
        await checkAdmin();


      if (!user) {
        return;
      }


      message.style.color = "#00ff99";
      message.textContent =
        "Posting...";


      const data = {

        name:
          document.getElementById("name").value.trim(),

        description:
          document.getElementById("description").value.trim(),

        mining_time:
          document.getElementById("mining_time").value.trim(),

        reward:
          document.getElementById("reward").value.trim(),

        min_withdraw:
          document.getElementById("min_withdraw").value.trim(),

        join_link:
          document.getElementById("join_link").value.trim()

      };


      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/airdrops`,
        {
          method: "POST",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify(data)
        }
      );


      if (!response.ok) {

        const errorText =
          await response.text();

        message.style.color = "#ff7777";

        message.textContent =
          "❌ " + errorText;

        return;
      }


      message.style.color = "#00ff99";

      message.textContent =
        "✅ Airdrop posted successfully!";


      form.reset();

    });


    // Logout
    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

      }
    );

  </script>

</body>
</html>
