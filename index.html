    /* =========================

    #search {

    /* =========================

    /* =========================

<body>

  <!-- =========================

  <header>

  <main class="container">

    <!-- =========================

    <div class="screenshot-box">

      <h2>

  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://zuqcvankzuofzzpdrycq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       AIRDROP ELEMENTS
    ========================= */

    const list =
      document.getElementById("airdropList");

    const search =
      document.getElementById("search");

    let allAirdrops = [];


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function safeURL(value) {

      if (!value) {
        return "#";
      }

      try {

        const url =
          new URL(value);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {
          return url.href;
        }

        return "#";

      } catch (error) {

        return "#";

      }
    }


    /* =========================
       DISPLAY AIRDROPS
    ========================= */

    function displayAirdrops(items) {

      if (
        !items ||
        items.length === 0
      ) {

        list.innerHTML = `
          <div class="empty">
            No airdrops found.
          </div>
        `;

        return;
      }


      list.innerHTML =
        items.map(item => {

          const name =
            escapeHTML(
              item.name ||
              "Unnamed Airdrop"
            );


          const description =
            escapeHTML(
              item.description ||
              "No description available."
            );


          const miningTime =
            escapeHTML(
              item.mining_time ||
              "Not specified"
            );


          const reward =
            escapeHTML(
              item.reward ||
              "Not specified"
            );


          const minWithdraw =
            escapeHTML(
              item.min_withdraw ||
              "Not specified"
            );


          const joinLink =
            safeURL(
              item.join_link
            );


          return `

            <div class="card">

              <h2>
                🚀 ${name}
              </h2>

              <div class="description">
                ${description}
              </div>

              <div class="info">

                <div>
                  ⛏️ Mining Time:
                  <strong>
                    ${miningTime}
                  </strong>
                </div>

                <div>
                  🎁 Reward:
                  <strong>
                    ${reward}
                  </strong>
                </div>

                <div>
                  💰 Minimum Withdraw:
                  <strong>
                    ${minWithdraw}
                  </strong>
                </div>

              </div>


              <a
                class="join-btn"
                href="${joinLink}"
                target="_blank"
                rel="noopener noreferrer"
              >
                JOIN NOW 🚀
              </a>

            </div>

          `;

        }).join("");

    }


    /* =========================
       LOAD AIRDROPS
    ========================= */

    async function loadAirdrops() {

      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/airdrops?select=*`,
            {
              method: "GET",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`

              }

            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            errorText
          );

        }


        allAirdrops =
          await response.json();


        displayAirdrops(
          allAirdrops
        );


      } catch (error) {

        console.error(error);

        list.innerHTML = `
          <div class="empty">
            ❌ Failed to load airdrops.
          </div>
        `;

      }

    }


    /* =========================
       SEARCH
    ========================= */

    search.addEventListener(
      "input",
      function() {

        const query =
          search.value
            .toLowerCase()
            .trim();


        if (!query) {

          displayAirdrops(
            allAirdrops
          );

          return;

        }


        const filtered =
          allAirdrops.filter(
            item => {

              const text = `
                ${item.name || ""}
                ${item.description || ""}
                ${item.mining_time || ""}
                ${item.reward || ""}
                ${item.min_withdraw || ""}
              `.toLowerCase();


              return text.includes(
                query
              );

            }
          );


        displayAirdrops(
          filtered
        );

      }
    );


    /* =========================
       SCREENSHOT ELEMENTS
    ========================= */

    const screenshotInput =
      document.getElementById(
        "screenshotInput"
      );


    const imagePreviewBox =
      document.getElementById(
        "imagePreviewBox"
      );


    const imagePreview =
      document.getElementById(
        "imagePreview"
      );


    const uploadScreenshotBtn =
      document.getElementById(
        "uploadScreenshotBtn"
      );


    const screenshotMessage =
      document.getElementById(
        "screenshotMessage"
      );


    let selectedScreenshot = null;


    /* =========================
       SELECT SCREENSHOT
    ========================= */

    screenshotInput.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) {

          selectedScreenshot = null;

          imagePreviewBox.style.display =
            "none";

          return;

        }


        /* Image check */

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          screenshotMessage.style.color =
            "#ff7777";

          screenshotMessage.textContent =
            "❌ Please select an image.";

          this.value = "";

          selectedScreenshot = null;

          imagePreviewBox.style.display =
            "none";

          return;

        }


        /* 5MB limit */

        if (
          file.size >
          5 * 1024 * 1024
        ) {

          screenshotMessage.style.color =
            "#ff7777";

          screenshotMessage.textContent =
            "❌ Image must be smaller than 5 MB.";

          this.value = "";

          selectedScreenshot = null;

          imagePreviewBox.style.display =
            "none";

          return;

        }


        selectedScreenshot =
          file;


        /* Preview */

        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            imagePreview.src =
              e.target.result;

            imagePreviewBox.style.display =
              "block";

          };


        reader.readAsDataURL(
          file
        );


        screenshotMessage.textContent =
          "";

      }
    );


    /* =========================
       UPLOAD SCREENSHOT
    ========================= */

    uploadScreenshotBtn.addEventListener(
      "click",
      async function() {

        if (!selectedScreenshot) {

          screenshotMessage.style.color =
            "#ff7777";

          screenshotMessage.textContent =
            "❌ Please select a screenshot first.";

          return;

        }


        uploadScreenshotBtn.disabled =
          true;

        uploadScreenshotBtn.textContent =
          "Uploading...";


        screenshotMessage.style.color =
          "#00ff99";

        screenshotMessage.textContent =
          "Please wait...";


        try {

          const file =
            selectedScreenshot;


          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();


          const randomName =
            Date.now() +
            "-" +
            Math.random()
              .toString(36)
              .substring(2, 10) +
            "." +
            extension;


          const filePath =
            "submissions/" +
            randomName;


          /* Upload to Supabase */

          const {
            data,
            error
          } =
            await supabaseClient
              .storage
              .from("screenshots")
              .upload(
                filePath,
                file,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType: file.type
                }
              );


          if (error) {
            throw error;
          }


          /* Success */

          screenshotMessage.style.color =
            "#00ff99";

          screenshotMessage.textContent =
            "✅ Screenshot submitted successfully!";


          screenshotInput.value =
            "";

          selectedScreenshot =
            null;

          imagePreviewBox.style.display =
            "none";


        } catch (error) {

          console.error(error);

          screenshotMessage.style.color =
            "#ff7777";

          screenshotMessage.textContent =
            "❌ Upload failed: " +
            error.message;

        } finally {

          uploadScreenshotBtn.disabled =
            false;

          uploadScreenshotBtn.textContent =
            "📤 SUBMIT SCREENSHOT";

        }

      }
    );


    /* =========================
       START WEBSITE
    ========================= */

    loadAirdrops();

  </script>

</body>
