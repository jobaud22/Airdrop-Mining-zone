<body>


  <header>

      </div>

  <footer>

  <script>

    const SUPABASE_URL =
      "https://zuqcvankzuofzzpdrycq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const list =
      document.getElementById("airdropList");

    const search =
      document.getElementById("search");


    let allAirdrops = [];


    // Escape HTML
    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    // Safe URL
    function safeURL(value) {

      if (!value) {
        return "#";
      }

      try {

        const url = new URL(value);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {
          return url.href;
        }

        return "#";

      } catch (error) {

        return "#";

      }

    }


    // Display airdrops
    function displayAirdrops(items) {

      if (
        !items ||
        items.length === 0
      ) {

        list.innerHTML =
          `<div class="empty">
            No airdrops found.
          </div>`;

        return;
      }


      list.innerHTML = items.map(item => {

        const name =
          escapeHTML(
            item.name ||
            "Unnamed Airdrop"
          );


        const description =
          escapeHTML(
            item.description ||
            "No description available."
          );


        const miningTime =
          escapeHTML(
            item.mining_time ||
            "Not specified"
          );


        const reward =
          escapeHTML(
            item.reward ||
            "Not specified"
          );


        const minWithdraw =
          escapeHTML(
            item.min_withdraw ||
            "Not specified"
          );


        const joinLink =
          safeURL(item.join_link);


        const screenshotURL =
          safeURL(item.screenshot_url);


        const screenshotHTML =
          item.screenshot_url &&
          screenshotURL !== "#"

          ? `
            <img
              class="airdrop-screenshot"
              src="${screenshotURL}"
              alt="${name} Screenshot"
              loading="lazy"
              onerror="this.style.display='none';"
            >
          `

          : "";


        return `

          <div class="card">

            <h2>
              🚀 ${name}
            </h2>


            ${screenshotHTML}


            <div class="description">
              ${description}
            </div>


            <div class="info">

              <div>
                ⛏️ Mining Time:
                <strong>
                  ${miningTime}
                </strong>
              </div>


              <div>
                🎁 Reward:
                <strong>
                  ${reward}
                </strong>
              </div>


              <div>
                💰 Minimum Withdraw:
                <strong>
                  ${minWithdraw}
                </strong>
              </div>

            </div>


            <a
              class="join-btn"
              href="${joinLink}"
              target="_blank"
              rel="noopener noreferrer"
            >
              JOIN NOW 🚀
            </a>

          </div>

        `;

      }).join("");

    }


    // Load airdrops
    async function loadAirdrops() {

      try {

        const {
          data,
          error
        } = await supabaseClient

          .from("airdrops")

          .select("*")

          .order("id", {
            ascending: false
          });


        if (error) {
          throw error;
        }


        allAirdrops = data || [];


        displayAirdrops(
          allAirdrops
        );


      } catch (error) {

        console.error(error);

        list.innerHTML =
          `<div class="empty">
            ❌ Failed to load airdrops.
          </div>`;

      }

    }


    // Search
    search.addEventListener(
      "input",
      function() {

        const query =
          search.value
            .toLowerCase()
            .trim();


        if (!query) {

          displayAirdrops(
            allAirdrops
          );

          return;

        }


        const filtered =
          allAirdrops.filter(
            item => {

              const text = `

                ${item.name || ""}

                ${item.description || ""}

                ${item.mining_time || ""}

                ${item.reward || ""}

                ${item.min_withdraw || ""}

              `.toLowerCase();


              return text.includes(
                query
              );

            }
          );


        displayAirdrops(
          filtered
        );

      }
    );


    loadAirdrops();

  </script>


</body>
