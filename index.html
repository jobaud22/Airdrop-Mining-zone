body {

/* CONTAINER */

/* AD AREA */

    width: 100%;

    margin: 15px 0;

.airdrop-grid {

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://zuqcvankzuofzzpdrycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


let allAirdrops = [];



/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================
   SAFE URL
========================= */

function safeURL(value) {

    try {

        const url = new URL(value);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {

            return url.href;

        }

    } catch {

    }

    return "#";

}



/* =========================
   LOAD AIRDROPS
========================= */

async function loadAirdrops() {

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const empty =
        document.getElementById("empty");

    const list =
        document.getElementById("airdropList");


    loading.style.display = "block";

    error.style.display = "none";

    empty.style.display = "none";


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/airdrops?select=*`,

            {

                method: "GET",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!response.ok) {

            const text =
                await response.text();

            throw new Error(text);

        }


        allAirdrops =
            await response.json();


        loading.style.display = "none";


        if (!allAirdrops.length) {

            empty.style.display = "block";

            return;

        }


        displayAirdrops(allAirdrops);


    } catch (err) {

        console.error(err);


        loading.style.display = "none";

        error.style.display = "block";

        error.innerHTML =
            "❌ Airdrop load করা যায়নি।<br><br>" +
            escapeHTML(err.message);

    }

}



/* =========================
   DISPLAY AIRDROPS
========================= */

function displayAirdrops(airdrops) {

    const list =
        document.getElementById("airdropList");

    const noResults =
        document.getElementById("noResults");


    list.innerHTML = "";


    if (!airdrops.length) {

        noResults.style.display = "block";

        return;

    }


    noResults.style.display = "none";


    airdrops.forEach(function(airdrop) {


        const name =
            escapeHTML(airdrop.name);


        const description =
            escapeHTML(
                airdrop.description ||
                "No description available."
            );


        const miningTime =
            escapeHTML(
                airdrop.mining_time ||
                "Not specified"
            );


        const reward =
            escapeHTML(
                airdrop.reward ||
                "Not specified"
            );


        const minWithdraw =
            escapeHTML(
                airdrop.min_withdraw ||
                "Not specified"
            );


        const joinLink =
            safeURL(
                airdrop.join_link
            );


        const card =
            document.createElement("div");


        card.className =
            "card";


        card.innerHTML = `

            <h2>
                🚀 ${name}
            </h2>

            <div class="description">
                ${description}
            </div>

            <div class="info">
                ⛏️ <strong>Mining Time:</strong>
                ${miningTime}
            </div>

            <div class="info">
                🎁 <strong>Reward:</strong>
                ${reward}
            </div>

            <div class="info">
                💰 <strong>Minimum Withdraw:</strong>
                ${minWithdraw}
            </div>

            <a
                class="join-btn"
                href="${joinLink}"
                target="_blank"
                rel="noopener noreferrer"
            >
                🔗 JOIN NOW
            </a>

        `;


        list.appendChild(card);

    });

}



/* =========================
   SEARCH
========================= */

function searchAirdrops() {

    const input =
        document.getElementById("searchInput");

    const keyword =
        input.value
        .toLowerCase()
        .trim();


    if (!keyword) {

        displayAirdrops(allAirdrops);

        return;

    }


    const filtered =
        allAirdrops.filter(function(airdrop) {

            const name =
                String(
                    airdrop.name || ""
                ).toLowerCase();


            const description =
                String(
                    airdrop.description || ""
                ).toLowerCase();


            const reward =
                String(
                    airdrop.reward || ""
                ).toLowerCase();


            return (

                name.includes(keyword) ||

                description.includes(keyword) ||

                reward.includes(keyword)

            );

        });


    displayAirdrops(filtered);

}



/* =========================
   START
========================= */

loadAirdrops();


</script>
