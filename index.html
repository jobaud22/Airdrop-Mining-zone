<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Airdrop Mining Zone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

header {
    text-align: center;
    padding: 25px 15px;
    background: #151515;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    color: #aaa;
    margin-bottom: 0;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: auto;
}

.ad-box {
    text-align: center;
    margin: 20px 0;
    min-height: 100px;
}

.card {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    margin: 18px 0;
    box-shadow: 0 5px 20px rgba(0,0,0,0.35);
}

.card h2 {
    margin-top: 0;
    font-size: 22px;
}

.info {
    margin: 10px 0;
    color: #ddd;
    line-height: 1.5;
}

.description {
    color: #ccc;
    line-height: 1.6;
    margin: 12px 0;
}

.join {
    display: block;
    text-align: center;
    background: #00c853;
    color: white;
    text-decoration: none;
    padding: 13px;
    border-radius: 10px;
    font-weight: bold;
    margin-top: 15px;
}

.join:hover {
    background: #00a844;
}

#loading {
    text-align: center;
    color: #aaa;
    padding: 30px;
}

#error {
    text-align: center;
    color: #ff5252;
    padding: 20px;
    word-break: break-word;
}

#empty {
    text-align: center;
    color: #aaa;
    padding: 30px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🚀 Airdrop Mining Zone</h1>
    <p>Free Airdrop & Mining Projects</p>
</header>

<div class="container">

    <!-- Adsterra -->
    <div class="ad-box">
        <script src="https://pl31571592.profitableratecpmnetwork.com/19/3d/7c/193d7c7412c3023da5f25f650b3ec909.js"></script>
    </div>

    <!-- Loading -->
    <div id="loading">
        ⏳ Loading Airdrops...
    </div>

    <!-- Error -->
    <div id="error"></div>

    <!-- Airdrops -->
    <div id="airdrops"></div>

    <!-- Empty -->
    <div id="empty"></div>

</div>

<footer>
    © 2026 Airdrop Mining Zone
</footer>

<script>

const SUPABASE_URL =
"https://zuqcvankzuofzzpdrycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function safeURL(value) {

    if (!value) {
        return "#";
    }

    try {

        const url = new URL(value);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {
            return url.href;
        }

    } catch (error) {
        return "#";
    }

    return "#";
}


async function loadAirdrops() {

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const airdropsBox =
        document.getElementById("airdrops");

    const emptyBox =
        document.getElementById("empty");


    loading.style.display = "block";
    errorBox.innerHTML = "";
    airdropsBox.innerHTML = "";
    emptyBox.innerHTML = "";


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/airdrops?select=*`,
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );


        const responseText =
            await response.text();


        if (!response.ok) {

            throw new Error(responseText);

        }


        let airdrops = [];

        try {

            airdrops = JSON.parse(responseText);

        } catch (jsonError) {

            throw new Error(
                "Supabase থেকে সঠিক JSON পাওয়া যায়নি।"
            );

        }


        loading.style.display = "none";


        if (
            !Array.isArray(airdrops) ||
            airdrops.length === 0
        ) {

            emptyBox.innerHTML =
                "📭 এখনো কোনো Airdrop পোস্ট করা হয়নি।";

            return;
        }


        airdrops.forEach(function(airdrop) {

            const card =
                document.createElement("div");

            card.className = "card";


            const name =
                escapeHTML(airdrop.name);

            const description =
                escapeHTML(airdrop.description);

            const miningTime =
                escapeHTML(airdrop.mining_time);

            const reward =
                escapeHTML(airdrop.reward);

            const minWithdraw =
                escapeHTML(airdrop.min_withdraw);

            const joinLink =
                safeURL(airdrop.join_link);


            card.innerHTML = `

                <h2>🚀 ${name}</h2>

                ${
                    description
                    ? `
                    <div class="description">
                        ${description}
                    </div>
                    `
                    : ""
                }

                ${
                    miningTime
                    ? `
                    <div class="info">
                        ⏱️ <strong>Mining Time:</strong>
                        ${miningTime}
                    </div>
                    `
                    : ""
                }

                ${
                    reward
                    ? `
                    <div class="info">
                        🎁 <strong>Reward:</strong>
                        ${reward}
                    </div>
                    `
                    : ""
                }

                ${
                    minWithdraw
                    ? `
                    <div class="info">
                        💰 <strong>Minimum Withdraw:</strong>
                        ${minWithdraw}
                    </div>
                    `
                    : ""
                }

                ${
                    joinLink !== "#"
                    ? `
                    <a
                        class="join"
                        href="${joinLink}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🚀 JOIN AIRDROP
                    </a>
                    `
                    : ""
                }

            `;


            airdropsBox.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Airdrops Load Error:",
            error
        );


        loading.style.display = "none";


        errorBox.innerHTML = `
            ❌ Airdrops load করা যায়নি।<br><br>
            <small>
                ${escapeHTML(error.message)}
            </small>
        `;

    }

}


loadAirdrops();

</script>

</body>
</html>
