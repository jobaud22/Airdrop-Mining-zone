<body>

  <script>

    const SUPABASE_URL =
      "https://zuqcvankzuofzzpdrycq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


    const list =
      document.getElementById("airdropList");

    const search =
      document.getElementById("search");


    let allAirdrops = [];


    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function safeURL(value) {

      if (!value) {
        return "#";
      }

      try {

        const url =
          new URL(value);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {
          return url.href;
        }

        return "#";

      } catch (error) {

        return "#";

      }
    }


    function displayAirdrops(items) {

      if (
        !items ||
        items.length === 0
      ) {

        list.innerHTML = `
          <div class="empty">
            No airdrops found.
          </div>
        `;

        return;
      }


      list.innerHTML =
        items.map(item => {

          const name =
            escapeHTML(
              item.name ||
              "Unnamed Airdrop"
            );

          const description =
            escapeHTML(
              item.description ||
              "No description available."
            );

          const miningTime =
            escapeHTML(
              item.mining_time ||
              "Not specified"
            );

          const reward =
            escapeHTML(
              item.reward ||
              "Not specified"
            );

          const minWithdraw =
            escapeHTML(
              item.min_withdraw ||
              "Not specified"
            );

          const joinLink =
            safeURL(item.join_link);


          return `

            <div class="card">

              <h2>
                🚀 ${name}
              </h2>

              <div class="description">
                ${description}
              </div>

              <div class="info">

                <div>
                  ⛏️ Mining Time:
                  <strong>
                    ${miningTime}
                  </strong>
                </div>

                <div>
                  🎁 Reward:
                  <strong>
                    ${reward}
                  </strong>
                </div>

                <div>
                  💰 Minimum Withdraw:
                  <strong>
                    ${minWithdraw}
                  </strong>
                </div>

              </div>

              <a
                class="join-btn"
                href="${joinLink}"
                target="_blank"
                rel="noopener noreferrer"
              >
                JOIN NOW 🚀
              </a>

            </div>

          `;

        }).join("");
    }


    async function loadAirdrops() {

      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/airdrops?select=*`,
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`
              }
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            errorText
          );
        }


        allAirdrops =
          await response.json();


        displayAirdrops(
          allAirdrops
        );


      } catch (error) {

        console.error(error);

        list.innerHTML = `
          <div class="empty">
            ❌ Failed to load airdrops.
          </div>
        `;
      }
    }


    search.addEventListener(
      "input",
      function() {

        const query =
          search.value
            .toLowerCase()
            .trim();


        if (!query) {

          displayAirdrops(
            allAirdrops
          );

          return;
        }


        const filtered =
          allAirdrops.filter(
            item => {

              const text = `
                ${item.name || ""}
                ${item.description || ""}
                ${item.mining_time || ""}
                ${item.reward || ""}
                ${item.min_withdraw || ""}
              `.toLowerCase();


              return text.includes(
                query
              );
            }
          );


        displayAirdrops(
          filtered
        );
      }
    );


    loadAirdrops();

  </script>

</body>
