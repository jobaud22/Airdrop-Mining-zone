<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Airdrop Mining Zone</title>
  <meta name="description" content="Free Airdrop & Mining Projects">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #ffffff;
    }

    header {
      text-align: center;
      padding: 25px 15px 20px;
      background: #101720;
      border-bottom: 1px solid #202a35;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      color: #00ff99;
    }

    header p {
      margin: 8px 0 0;
      color: #aab4bf;
      font-size: 14px;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: auto;
    }

    .post-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 20px 0 15px;
      background: #00d084;
      color: #001b10;
      text-decoration: none;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      border-radius: 10px;
    }

    .post-btn:hover {
      background: #00ff99;
    }

    #search {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #111820;
      color: #ffffff;
      border: 1px solid #293541;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    #search:focus {
      border-color: #00d084;
    }

    #airdropList {
      display: grid;
      gap: 15px;
    }

    .card {
      background: #111820;
      border: 1px solid #202b36;
      border-radius: 12px;
      padding: 18px;
    }

    .card h2 {
      margin: 0 0 10px;
      color: #00ff99;
      font-size: 21px;
      word-break: break-word;
    }

    .airdrop-screenshot {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      display: block;
      margin: 10px 0 15px;
      border-radius: 10px;
      border: 1px solid #293541;
      background: #0b1015;
    }

    .description {
      color: #c5ced7;
      line-height: 1.5;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
    }

    .info div {
      background: #0b1015;
      padding: 9px;
      border-radius: 7px;
      color: #dce4eb;
      font-size: 14px;
      word-break: break-word;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #00d084;
      color: #001b10;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .join-btn:hover {
      background: #00ff99;
    }

    .empty {
      text-align: center;
      color: #8d99a5;
      padding: 30px 10px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      color: #707b86;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      header h1 {
        font-size: 24px;
      }

      .card {
        padding: 15px;
      }

      .card h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- ONLY ONE AD SCRIPT - IMMEDIATELY AFTER BODY -->
  <script src="https://pl31571592.profitableratecpmnetwork.com/19/3d/7c/193d7c7412c3023da5f25f650b3ec909.js"></script>

  <header>
    <h1>🚀 Airdrop Mining Zone</h1>
    <p>Free Airdrop & Mining Projects</p>
  </header>

  <main class="container">

    <a class="post-btn" href="login.html">
      🔐 ADMIN LOGIN
    </a>

    <input
      type="text"
      id="search"
      placeholder="🔍 Search Airdrop..."
      autocomplete="off"
    >

    <div id="airdropList">
      <div class="empty">
        ⏳ Loading airdrops...
      </div>
    </div>

  </main>

  <footer>
    © 2026 Airdrop Mining Zone
  </footer>

  <script>
    const SUPABASE_URL =
      "https://zuqcvankzuofzzpdrycq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const list =
      document.getElementById("airdropList");

    const search =
      document.getElementById("search");

    let allAirdrops = [];

    function escapeHTML(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safeURL(value) {
      if (!value) {
        return "#";
      }

      try {
        const url = new URL(value);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {
          return url.href;
        }

        return "#";

      } catch {
        return "#";
      }
    }

    function displayAirdrops(items) {

      if (!items || items.length === 0) {

        list.innerHTML = `
          <div class="empty">
            📭 No airdrops found.
          </div>
        `;

        return;
      }

      list.innerHTML = items.map(item => {

        const name =
          escapeHTML(
            item.name || "Unnamed Airdrop"
          );

        const description =
          escapeHTML(
            item.description ||
            "No description available."
          );

        const miningTime =
          escapeHTML(
            item.mining_time ||
            "Not specified"
          );

        const reward =
          escapeHTML(
            item.reward ||
            "Not specified"
          );

        const minWithdraw =
          escapeHTML(
            item.min_withdraw ||
            "Not specified"
          );

        const joinLink =
          safeURL(item.join_link);

        const screenshotURL =
          safeURL(item.screenshot_url);

        let screenshotHTML = "";

        if (
          item.screenshot_url &&
          screenshotURL !== "#"
        ) {

          screenshotHTML = `
            <img
              class="airdrop-screenshot"
              src="${screenshotURL}"
              alt="${name} Screenshot"
              loading="lazy"
              onerror="this.style.display='none';"
            >
          `;
        }

        return `
          <div class="card">

            <h2>
              🚀 ${name}
            </h2>

            ${screenshotHTML}

            <div class="description">
              ${description}
            </div>

            <div class="info">

              <div>
                ⛏️ Mining Time:
                <strong>${miningTime}</strong>
              </div>

              <div>
                🎁 Reward:
                <strong>${reward}</strong>
              </div>

              <div>
                💰 Minimum Withdraw:
                <strong>${minWithdraw}</strong>
              </div>

            </div>

            <a
              class="join-btn"
              href="${joinLink}"
              target="_blank"
              rel="noopener noreferrer"
            >
              JOIN NOW 🚀
            </a>

          </div>
        `;

      }).join("");
    }

    async function loadAirdrops() {

      try {

        list.innerHTML = `
          <div class="empty">
            ⏳ Loading airdrops...
          </div>
        `;

        const {
          data,
          error
        } = await supabaseClient
          .from("airdrops")
          .select("*");

        if (error) {
          throw error;
        }

        allAirdrops = data || [];

        displayAirdrops(allAirdrops);

      } catch (error) {

        console.error(
          "Load error:",
          error
        );

        list.innerHTML = `
          <div class="empty">
            ❌ Failed to load airdrops.
            <br><br>
            <small>
              Please refresh the page.
            </small>
          </div>
        `;
      }
    }

    search.addEventListener(
      "input",
      function () {

        const query =
          search.value
            .toLowerCase()
            .trim();

        if (!query) {

          displayAirdrops(
            allAirdrops
          );

          return;
        }

        const filtered =
          allAirdrops.filter(item => {

            const text = `
              ${item.name || ""}
              ${item.description || ""}
              ${item.mining_time || ""}
              ${item.reward || ""}
              ${item.min_withdraw || ""}
            `.toLowerCase();

            return text.includes(query);
          });

        displayAirdrops(filtered);
      }
    );

    loadAirdrops();
  </script>

</body>
</html>
