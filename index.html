<header>

</footer>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://zuqcvankzuofzzpdrycq.supabase.co";


const SUPABASE_KEY =
"sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


/* Store all data */

let allAirdrops = [];



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}



/* =========================
   SAFE URL
========================= */

function safeURL(url) {

    try {

        const parsed =
            new URL(url);

        if (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        ) {

            return parsed.href;

        }

    } catch (error) {

        return "#";

    }

    return "#";
}



/* =========================
   LOAD AIRDROPS
========================= */

async function loadAirdrops() {

    const loading =
        document.getElementById(
            "loading"
        );

    const errorBox =
        document.getElementById(
            "error"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const container =
        document.getElementById(
            "airdrops"
        );


    loading.style.display =
        "block";


    errorBox.style.display =
        "none";


    empty.style.display =
        "none";


    container.innerHTML =
        "";


    try {


        const response =
            await fetch(

                `${SUPABASE_URL}/rest/v1/airdrops?select=*`,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        const responseText =
            await response.text();


        if (!response.ok) {

            throw new Error(
                responseText
            );

        }


        const data =
            JSON.parse(
                responseText
            );


        allAirdrops =
            data;


        loading.style.display =
            "none";


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            empty.style.display =
                "block";

            return;

        }


        renderAirdrops(data);


    } catch (error) {


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.innerHTML =

            "❌ Airdrop load করা যায়নি.<br><br>" +

            escapeHTML(
                error.message
            );


        console.error(error);

    }

}



/* =========================
   RENDER AIRDROPS
========================= */

function renderAirdrops(data) {

    const container =
        document.getElementById(
            "airdrops"
        );


    const noResults =
        document.getElementById(
            "noResults"
        );


    container.innerHTML =
        "";


    if (data.length === 0) {

        noResults.style.display =
            "block";

        return;

    }


    noResults.style.display =
        "none";


    data.forEach(
        function(airdrop) {


            const name =
                escapeHTML(
                    airdrop.name
                );


            const description =
                escapeHTML(

                    airdrop.description ||

                    "No description available."

                );


            const miningTime =
                escapeHTML(

                    airdrop.mining_time ||

                    "Not specified"

                );


            const reward =
                escapeHTML(

                    airdrop.reward ||

                    "Not specified"

                );


            const minWithdraw =
                escapeHTML(

                    airdrop.min_withdraw ||

                    "Not specified"

                );


            const joinLink =
                safeURL(
                    airdrop.join_link
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <h2>
                    🪙 ${name}
                </h2>

                <div class="description">
                    ${description}
                </div>

                <div class="info">

                    <div class="info-row">
                        ⏱️
                        <strong>
                            Mining:
                        </strong>
                        ${miningTime}
                    </div>


                    <div class="info-row">
                        🎁
                        <strong>
                            Reward:
                        </strong>
                        ${reward}
                    </div>


                    <div class="info-row">
                        💰
                        <strong>
                            Min Withdraw:
                        </strong>
                        ${minWithdraw}
                    </div>

                </div>


                <a
                    class="join-button"
                    href="${joinLink}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🚀 JOIN NOW
                </a>

            `;


            container.appendChild(
                card
            );

        }
    );

}



/* =========================
   SEARCH
========================= */

function searchAirdrops() {


    const input =
        document.getElementById(
            "searchInput"
        );


    const keyword =
        input.value
            .trim()
            .toLowerCase();


    if (!keyword) {

        renderAirdrops(
            allAirdrops
        );

        return;

    }


    const filtered =
        allAirdrops.filter(

            function(airdrop) {


                const name =
                    String(
                        airdrop.name || ""
                    ).toLowerCase();


                const description =
                    String(
                        airdrop.description || ""
                    ).toLowerCase();


                const reward =
                    String(
                        airdrop.reward || ""
                    ).toLowerCase();


                return (

                    name.includes(
                        keyword
                    )

                    ||

                    description.includes(
                        keyword
                    )

                    ||

                    reward.includes(
                        keyword
                    )

                );

            }

        );


    renderAirdrops(
        filtered
    );

}



/* =========================
   START
========================= */

loadAirdrops();


</script>
