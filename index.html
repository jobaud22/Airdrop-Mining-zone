  <style>

    * {

    /* SEARCH */

    #search {
      width: 100%;

      padding: 14px;

      margin-bottom: 20px;

      color: white;

      border: 1px solid #293541;

    /* AIRDROP LIST */

    /* AIRDROP CARD */

    /* SCREENSHOT */

    /* DESCRIPTION */

    /* INFO */

    /* EMPTY / ERROR */

    /* FOOTER */

    /* MOBILE */

<body>


  <!-- HEADER -->

  <header>

    <h1>
      🚀 Airdrop Mining Zone

  </header>



  <main class="container">


    <!-- 728x90 AD -->

    <div class="ad-box">

      <div class="banner-wrapper">

        <script>

          atOptions = {

            'key':
              '7b6610d00f3b870fe5ef7fc3670be8af',

              90,

    </div>



    <!-- ADMIN LOGIN -->

    <a
      class="post-btn"

    <!-- SEARCH -->

      </div>

  <!-- FOOTER -->

  <footer>

    © 2026 Airdrop Mining Zone

  </footer>



  <script>


    /* SUPABASE */

    const SUPABASE_URL =
      "https://zuqcvankzuofzzpdrycq.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_T_q8uZXUsSE2zidrfoYraw_KEqa5G7X";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* ELEMENTS */

    const list =
      document.getElementById(
        "airdropList"
      );


    const search =
      document.getElementById(
        "search"
      );


    /* ALL AIRDROPS */

    let allAirdrops = [];



    /* ESCAPE HTML */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* SAFE URL */

    function safeURL(value) {

      if (!value) {

        return "#";

      }


      try {

        const url =
          new URL(value);


        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {

          return url.href;

        }


        return "#";


      } catch (error) {

        return "#";

      }

    }



    /* DISPLAY AIRDROPS */

    function displayAirdrops(items) {


      if (
        !items ||
        items.length === 0
      ) {

        list.innerHTML = `

          <div class="empty">

            📭 No airdrops found.

          </div>

        `;

        return;

      }



      list.innerHTML = items.map(
        item => {


          /* NAME */

          const name =
            escapeHTML(
              item.name ||
              "Unnamed Airdrop"
            );



          /* DESCRIPTION */

          const description =
            escapeHTML(
              item.description ||
              "No description available."
            );



          /* MINING TIME */

          const miningTime =
            escapeHTML(
              item.mining_time ||
              "Not specified"
            );



          /* REWARD */

          const reward =
            escapeHTML(
              item.reward ||
              "Not specified"
            );



          /* MINIMUM WITHDRAW */

          const minWithdraw =
            escapeHTML(
              item.min_withdraw ||
              "Not specified"
            );



          /* JOIN LINK */

          const joinLink =
            safeURL(
              item.join_link
            );



          /* SCREENSHOT */

          const screenshotURL =
            safeURL(
              item.screenshot_url
            );



          let screenshotHTML =
            "";


          if (
            item.screenshot_url &&
            screenshotURL !== "#"
          ) {

            screenshotHTML = `

              <img

                class="airdrop-screenshot"

                src="${screenshotURL}"

                alt="${name} Screenshot"

                loading="lazy"

                onerror="
                  this.style.display='none';
                "

              >

            `;

          }



          /* CARD */

          return `

            <div class="card">


              <h2>

                🚀 ${name}

              </h2>


              ${screenshotHTML}


              <div class="description">

                ${description}

              </div>


              <div class="info">


                <div>

                  ⛏️ Mining Time:

                  <strong>

                    ${miningTime}

                  </strong>

                </div>


                <div>

                  🎁 Reward:

                  <strong>

                    ${reward}

                  </strong>

                </div>


                <div>

                  💰 Minimum Withdraw:

                  <strong>

                    ${minWithdraw}

                  </strong>

                </div>


              </div>


              <a

                class="join-btn"

                href="${joinLink}"

                target="_blank"

                rel="noopener noreferrer"

              >

                JOIN NOW 🚀

              </a>


            </div>

          `;


        }

      ).join("");

    }



    /* LOAD AIRDROPS */

    async function loadAirdrops() {


      try {


        list.innerHTML = `

          <div class="empty">

            ⏳ Loading airdrops...

          </div>

        `;



        const {
          data,
          error
        } = await supabaseClient

          .from("airdrops")

          .select("*");



        /* SUPABASE ERROR */

        if (error) {

          console.error(
            "Supabase error:",
            error
          );

          throw error;

        }



        /* SAVE DATA */

        allAirdrops =
          data || [];



        /* DISPLAY */

        displayAirdrops(
          allAirdrops
        );


      }


      catch (error) {


        console.error(
          "Load airdrops error:",
          error
        );


        list.innerHTML = `

          <div class="empty">

            ❌ Failed to load airdrops.

            <br><br>

            <small>

              Please refresh the page.

            </small>

          </div>

        `;

      }

    }



    /* SEARCH */

    search.addEventListener(
      "input",
      function() {


        const query =
          search.value
            .toLowerCase()
            .trim();



        /* SHOW ALL */

        if (!query) {

          displayAirdrops(
            allAirdrops
          );

          return;

        }



        /* FILTER */

        const filtered =
          allAirdrops.filter(
            item => {


              const text = `

                ${item.name || ""}

                ${item.description || ""}

                ${item.mining_time || ""}

                ${item.reward || ""}

                ${item.min_withdraw || ""}

              `.toLowerCase();



              return text.includes(
                query
              );

            }
          );



        displayAirdrops(
          filtered
        );


      }
    );



    /* START */

    loadAirdrops();


  </script>


</body>
